<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      (function () {
        const url = new URL(window.location.href);
        const redirectedPath = url.pathname + url.search + url.hash;

        if (!redirectedPath || redirectedPath === '/') {
          return;
        }

        window.history.replaceState(null, '', '/?redirect=' + encodeURIComponent(redirectedPath));
        window.location.href = '/?redirect=' + encodeURIComponent(redirectedPath);
      })();
    </script>
  </body>
</html>
